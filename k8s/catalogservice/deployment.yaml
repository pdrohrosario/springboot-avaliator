apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalogservice
  namespace: avaliator
  labels:
    app.kubernetes.io/name: catalogservice
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: avaliator
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: catalogservice
  template:
    metadata:
      labels:
        app: catalogservice
        app.kubernetes.io/part-of: avaliator
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            [
              "sh",
              "-c",
              'until nc -z postgres 5432; do echo "Esperando Postgres..."; sleep 2; done',
            ]
      containers:
        - name: catalogservice
          image: localhost:5001/catalogservice:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: catalogservice-config
          env:
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              memory: "384Mi"
              cpu: "250m"
            limits:
              memory: "768Mi"
              cpu: "1000m"
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            initialDelaySeconds: 0
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            initialDelaySeconds: 0
            periodSeconds: 5
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: catalogservice
  namespace: avaliator
  labels:
    app.kubernetes.io/name: catalogservice
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: avaliator
spec:
  selector:
    app: catalogservice
  ports:
    - port: 8081
      targetPort: 8081
      protocol: TCP
  type: ClusterIP
