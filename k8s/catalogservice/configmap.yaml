apiVersion: v1
kind: ConfigMap
metadata:
  name: catalogservice-config
  namespace: avaliator
  labels:
    app.kubernetes.io/name: catalogservice
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: avaliator
data:
  SPRING_APPLICATION_NAME: "catalogservice"
  SERVER_PORT: "8081"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/avaliator"
  SPRING_JPA_HIBERNATE_DDL_AUTO: "none"
  SPRING_JPA_SHOW_SQL: "true"
  SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: "org.hibernate.dialect.PostgreSQLDialect"
  SPRING_FLYWAY_ENABLED: "true"
  SPRING_FLYWAY_DEFAULT_SCHEMA: "catalog_schema"
  SPRING_FLYWAY_SCHEMAS: "catalog_schema"
  SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA: "catalog_schema"
  SPRING_FLYWAY_LOCATIONS: "classpath:db/migration"
  SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
